<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS Safety Platform - 3D 可视化</title>
    
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
                min-height: 100vh;
            }
            
            .container {
                width: 100vw;
                height: 100vh;
                position: relative;
                perspective: 1000px;
            }
            
            .scene {
                position: absolute;
                width: 800px;
                height: 600px;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotateX(30deg);
                transform-style: preserve-3d;
                background: rgba(0, 0, 0, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 20px;
            }
            
            .ground {
                position: absolute;
                width: 1200px;
                height: 1200px;
                left: 50%;
                top: 50%;
                transform: translate(-50%, 0) rotateX(90deg);
                background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%);
                border: 1px solid rgba(0, 255, 0, 0.3);
                border-radius: 10px;
                box-shadow: 0 0 50px rgba(0, 255, 0, 0.1);
            }
            
            .ground::before {
                content: "";
                position: absolute;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
                            radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0%, transparent 50%);
            }
            
            .vehicle {
                position: absolute;
                transform-style: preserve-3d;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                cursor: pointer;
            }
            
            .vehicle.ego {
                width: 45px;
                height: 18px;
                background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
                border: 2px solid #27ae60;
                border-radius: 8px;
                box-shadow: 0 0 30px rgba(39, 174, 96, 0.5);
            }
            
            .vehicle.npc {
                width: 40px;
                height: 18px;
                background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
                border: 2px solid #3498db;
                border-radius: 8px;
                box-shadow: 0 0 20px rgba(52, 152, 219, 0.3);
            }
            
            .vehicle:hover {
                box-shadow: 0 0 50px rgba(255, 255, 255, 0.8) !important;
                transform: scale(1.15);
            }
            
            .vehicle::before {
                content: attr(data-id);
                position: absolute;
                top: -25px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: #fff;
                padding: 4px 12px;
                border-radius: 15px;
                font-size: 12px;
                font-weight: bold;
                white-space: nowrap;
                z-index: 10;
            }
            
            .traffic-light {
                position: absolute;
                width: 30px;
                height: 100px;
                background: #34495e;
                border-radius: 15px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            }
            
            .traffic-light .light {
                position: absolute;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                margin: 15px 0;
                transition: opacity 0.3s;
            }
            
            .traffic-light .red { background: #e74c3c; box-shadow: 0 0 15px #e74c3c; }
            .traffic-light .green { background: #2ecc71; box-shadow: 0 0 15px #2ecc71; }
            .traffic-light .yellow { background: #f39c12; box-shadow: 0 0 15px #f39c12; }
            
            .traffic-light.red .green, .traffic-light.red .yellow { opacity: 0.3; }
            .traffic-light.green .red, .traffic-light.green .yellow { opacity: 0.3; }
            .traffic-light.yellow .red, .traffic-light.yellow .green { opacity: 0.3; }
            
            .risk-zone {
                position: absolute;
                border: 3px dashed;
                border-radius: 50%;
                opacity: 0.4;
                animation: pulse 2s infinite;
            }
            
            .risk-zone.high {
                border-color: #e74c3c;
                background: radial-gradient(circle, rgba(231, 76, 60, 0.1) 0%, transparent 70%);
            }
            
            .risk-zone.medium {
                border-color: #f39c12;
                background: radial-gradient(circle, rgba(243, 156, 18, 0.1) 0%, transparent 70%);
            }
            
            @keyframes pulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 0.7; }
            }
            
            .axes {
                position: absolute;
                width: 400px;
                height: 400px;
                left: 20px;
                bottom: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 5;
            }
            
            .axis-x {
                width: 350px;
                height: 3px;
                background: #e74c3c;
            }
            
            .axis-x::before {
                content: "X";
                position: absolute;
                right: -20px;
                top: -10px;
                color: #e74c3c;
                font-weight: bold;
            }
            
            .axis-y {
                position: absolute;
                width: 3px;
                height: 350px;
                background: #3498db;
                transform: rotate(90deg);
                top: -180px;
                left: 175px;
            }
            
            .axis-y::before {
                content: "Y";
                position: absolute;
                left: -20px;
                top: -10px;
                color: #3498db;
                font-weight: bold;
            }
            
            .control-panel {
                position: absolute;
                top: 20px;
                right: 20px;
                background: rgba(0, 0, 0, 0.7);
                padding: 15px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
                z-index: 100;
            }
            
            .btn {
                display: block;
                width: 100%;
                padding: 10px;
                margin: 5px 0;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                transition: background 0.3s;
            }
            
            .btn:hover {
                background: #764ba2;
            }
            
            .info-panel {
                position: absolute;
                bottom: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.7);
                padding: 15px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
                max-width: 300px;
            }
            
            .info-panel h3 {
                margin: 0 0 10px 0;
                color: #667eea;
            }
            
            .info-item {
                margin: 8px 0;
                font-size: 13px;
            }
            
            .info-label {
                color: #a0a0a0;
            }
            
            .info-value {
                color: #fff;
                font-weight: bold;
            }
            
            .risk-badge {
                padding: 5px 15px;
                border-radius: 20px;
                font-weight: bold;
            }
            
            .risk-badge.critical { background: #e74c3c; }
            .risk-badge.high { background: #e67e22; }
            .risk-badge.medium { background: #f39c12; }
            .risk-badge.low { background: #2ecc71; }
        </style>
        
</head>
<body>
    
            <div class="container">
                <div class="scene" id="scene">
                    <div class="ground"></div>
                    
            <div class="vehicle ego" style="left: 250.0px; top: 300.0px; transform: rotate(0.0deg);"
                 data-id="🚗 Ego" title="自车 (ego)">
            </div>
                    
                    
                    <div class="axes"></div>
                </div>
                
            <div class="control-panel">
                <button class="btn" onclick="rotateView()">🔄 旋转视角</button>
                <button class="btn" onclick="zoomIn()">🔍 放大</button>
                <button class="btn" onclick="zoomOut()">🔎 缩小</button>
            </div>
        
                
            <div class="info-panel">
                <h3>🚗 交通信息</h3>
                <div class="info-item">
                    <span class="info-label">风险指数:</span>
                    <span class="info-value"><span class="risk-badge low">🟢 0.10</span></span>
                </div>
                <div class="info-item">
                    <span class="info-label">自车位置:</span>
                    <span class="info-value">(-15.0m, 0.0m)</span>
                </div>
                <div class="info-item">
                    <span class="info-label">自车速度:</span>
                    <span class="info-value">10.0 m/s</span>
                </div>
                <div class="info-item">
                    <span class="info-label">车辆数量:</span>
                    <span class="info-value">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">交通灯:</span>
                    <span class="info-value">0</span>
                </div>
            </div>
        
            </div>
        
    
            <div class="control-panel">
                <button class="btn" onclick="rotateView()">🔄 旋转视角</button>
                <button class="btn" onclick="zoomIn()">🔍 放大</button>
                <button class="btn" onclick="zoomOut()">🔎 缩小</button>
            </div>
        
    
            <div class="info-panel">
                <h3>🚗 交通信息</h3>
                <div class="info-item">
                    <span class="info-label">风险指数:</span>
                    <span class="info-value"><span class="risk-badge low">🟢 0.10</span></span>
                </div>
                <div class="info-item">
                    <span class="info-label">自车位置:</span>
                    <span class="info-value">(-15.0m, 0.0m)</span>
                </div>
                <div class="info-item">
                    <span class="info-label">自车速度:</span>
                    <span class="info-value">10.0 m/s</span>
                </div>
                <div class="info-item">
                    <span class="info-label">车辆数量:</span>
                    <span class="info-value">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">交通灯:</span>
                    <span class="info-value">0</span>
                </div>
            </div>
        
    <script>
        let rotation = 0;
        let zoom = 1;
        
        function rotateView() {
            const scene = document.getElementById('scene');
            rotation += 45;
            scene.style.transform = `translate(-50%, -50%) rotateX(30deg) rotateY(${rotation}deg)`;
        }
        
        function zoomIn() {
            zoom *= 0.9;
            document.getElementById('scene').style.transform = `translate(-50%, -50%) rotateX(30deg) scale(${zoom})`;
        }
        
        function zoomOut() {
            zoom *= 1.1;
            document.getElementById('scene').style.transform = `translate(-50%, -50%) rotateX(30deg) scale(${zoom})`;
        }
        
        function showDetails() {
            alert(`{
  "frame": {
    "id": 1,
    "timestamp": "",
    "ego": {
      "id": "ego",
      "type": "vehicle.ego",
      "x": -15.0,
      "y": 0,
      "speed": 10.0,
      "yaw": 0,
      "vx": 10.0,
      "vy": 0.0
    },
    "vehicles": [],
    "traffic_lights": [],
    "pedestrians": [
      {
        "id": "ped_0",
        "x": 0,
        "y": 2,
        "speed": 1.0,
        "direction": 1.5707963267948966
      }
    ]
  },
  "violations": [],
  "risk": {
    "risk_index": 0.1,
    "risk_level": "LOW"
  },
  "stats": {
    "total_fps": 100,
    "detection_count": 0,
    "safe_rate": 100,
    "cache_hit_rate": 92.0,
    "avg_latency_ms": 0.09942054748535156,
    "parallel_speedup": 4.0
  },
  "metadata": {
    "source": "FALLBACK",
    "scenario_name": "人行横道场景",
    "scenario_type": "pedestrian_crossing",
    "extracted_at": "2026-08-25T09:12:24.181679"
  }
}`);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r') rotateView();
            if (e.key === '+') zoomIn();
            if (e.key === '-') zoomOut();
        });
    </script>
</body>
</html>
