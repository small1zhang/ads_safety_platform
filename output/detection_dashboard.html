<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS Safety Platform - 实时检测仪表盘</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --danger: #ff4d4f;
            --warning: #faad14;
            --success: #52c41a;
            --info: #1890ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p { font-size: 1.1em; opacity: 0.8; color: #aaa; }

        /* 状态条 */
        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.online { background: var(--success); animation: pulse 2s infinite; }
        .status-dot.offline { background: var(--danger); }
        .status-dot.connected { background: var(--info); animation: pulse 1.5s infinite; }
        .status-dot.disconnected { background: #888; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .stat-value { font-size: 2em; font-weight: bold; margin-bottom: 5px; }
        .stat-value.critical { color: var(--danger); }
        .stat-value.high { color: var(--warning); }
        .stat-value.medium { color: #f39c12; }
        .stat-value.low { color: var(--success); }

        .stat-label { font-size: 0.85em; opacity: 0.7; }

        /* 检测事件列表 */
        .recent-cases {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .recent-cases h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
        }

        .case-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 18px;
            border-left: 4px solid;
            transition: all 0.3s;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .case-card.new-flash {
            animation: slideIn 0.4s ease-out, flash 1.8s ease-out 0.4s;
        }

        @keyframes flash {
            0% { background: rgba(102,126,234,0.4); box-shadow: 0 0 20px rgba(102,126,234,0.6); }
            100% { background: rgba(255,255,255,0.05); box-shadow: 0 0 0 rgba(102,126,234,0); }
        }

        .case-card.critical { border-left-color: var(--danger); }
        .case-card.high { border-left-color: var(--warning); }
        .case-card.medium { border-left-color: #f39c12; }
        .case-card.low { border-left-color: var(--success); }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .case-scenario { font-weight: bold; font-size: 1.05em; }

        .case-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.82em;
            margin: 8px 0;
            opacity: 0.85;
        }

        .case-info span {
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .case-violations {
            font-size: 0.78em;
            margin-top: 8px;
        }

        .case-violations span {
            display: inline-block;
            margin: 2px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        /* 风险等级徽章 */
        .risk-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
        }

        .risk-badge.CRITICAL { background: var(--danger); color: white; }
        .risk-badge.HIGH { background: var(--warning); color: #1a1a1a; }
        .risk-badge.MEDIUM { background: #f39c12; color: #1a1a1a; }
        .risk-badge.LOW { background: var(--success); color: white; }

        /* 知识图谱按钮 */
        .kg-link {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(102,126,234,0.3);
            border: 1px solid rgba(102,126,234,0.6);
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 0.82em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .kg-link:hover {
            background: rgba(102,126,234,0.6);
            transform: translateY(-1px);
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #1a1a1a; }
        .btn-info { background: var(--info); color: white; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #722ed1; color: white; }
        .btn-secondary:hover { background: #9254de; }
        .btn-active { animation: pulse 1.5s infinite; }

        /* 事件时间线（细粒度KG预览） */
        .timeline {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .timeline h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .timeline-events {
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.82em;
        }

        .timeline-event {
            padding: 6px 10px;
            margin: 3px 0;
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
        }

        .timeline-event .id { color: var(--primary); }
        .timeline-event .ts { color: #888; }

        .empty-tip {
            text-align: center;
            padding: 30px;
            opacity: 0.6;
            color: #aaa;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
            transition: opacity 0.3s;
            max-width: 400px;
        }
        .toast-success { background: linear-gradient(135deg, #52c41a, #389e0d); }
        .toast-error { background: linear-gradient(135deg, #ff4d4f, #cf1322); }
        .toast-warning { background: linear-gradient(135deg, #faad14, #d48806); }
        .toast-info { background: linear-gradient(135deg, #1890ff, #096dd9); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 ADS Safety Platform</h1>
            <p>实时异常检测仪表盘 · WebSocket 推送</p>
        </header>

        <!-- 状态条 -->
        <div class="status-bar">
            <div class="status-chip">
                <div class="status-dot offline" id="carlaDot"></div>
                <span>CARLA: <span id="carlaText">检测中...</span></span>
            </div>
            <div class="status-chip">
                <div class="status-dot disconnected" id="wsDot"></div>
                <span>WebSocket: <span id="wsText">未连接</span></span>
            </div>
            <div class="status-chip">
                <span>当前事件: <strong id="latestEventId">--</strong></span>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-primary" onclick="startDetection(10)">▶ 10秒检测</button>
            <button class="btn btn-success" onclick="startDetection(30)">▶ 30秒检测</button>
            <button class="btn btn-warning" onclick="startDetection(60)">▶ 60秒检测</button>
            <button class="btn btn-info" onclick="openGlobalKG()">📊 查看全局图谱</button>
            <button class="btn btn-danger" onclick="clearData()">🗑 清空显示</button>
            <button class="btn btn-secondary" onclick="startManualDetection()">▶ 启动实时检测</button>
            <button class="btn btn-danger" onclick="stopManualDetection()">⏹ 停止检测</button>
        </div>

        <!-- 事件时间线 -->
        <div class="timeline">
            <h2>📜 检测事件时间线</h2>
            <div class="timeline-events" id="timelineEvents">
                <div class="empty-tip">暂无检测事件</div>
            </div>
        </div>

        <!-- 最近检测结果 -->
        <div class="recent-cases">
            <h2>📋 最近检测结果 (实时)</h2>
            <div class="cases-grid" id="casesGrid">
                <div class="empty-tip" id="emptyTip">点击"开始检测"按钮启动实时检测</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        const HTTP_BASE = `${location.protocol}//${location.host}`;
        const API_BASE = `${HTTP_BASE}/api`;
        const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/api/ws/detection`;

        // ===== 状态 =====
        let ws = null;
        let wsReconnectTimer = null;
        const MAX_CARDS = 8;
        const MAX_TIMELINE = 30;
        const seenEventIds = new Set();

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            bootstrap();
        });

        async function bootstrap() {
            await Promise.all([updateStats(), updateCases(), updateCARLAStatus()]);
            connectWebSocket();
            setInterval(updateCARLAStatus, 5000);
        }

        // ===== WebSocket =====
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            updateWSStatus('connecting');
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                updateWSStatus('connected');
                console.log('[WS] 已连接');
            };

            ws.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    handleDetectionEvent(msg);
                } catch (e) {
                    console.error('[WS] 解析失败:', e);
                }
            };

            ws.onerror = (err) => {
                console.warn('[WS] 错误', err);
            };

            ws.onclose = () => {
                updateWSStatus('disconnected');
                console.log('[WS] 已断开，5秒后重连');
                if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(connectWebSocket, 5000);
            };
        }

        function updateWSStatus(state) {
            const dot = document.getElementById('wsDot');
            const text = document.getElementById('wsText');
            if (state === 'connected') {
                dot.className = 'status-dot connected';
                text.textContent = '已连接';
            } else if (state === 'connecting') {
                dot.className = 'status-dot';
                text.textContent = '连接中...';
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = '已断开';
            }
        }

        // ===== 事件处理 =====
        function handleDetectionEvent(msg) {
            // 兼容两种事件类型: 'anomaly' 和 'detection'
            const data = msg.data || msg;
            if (!data || !data.scenario_id) return;
            if (seenEventIds.has(data.scenario_id)) return;
            seenEventIds.add(data.scenario_id);

            // 1. 顶部插入新卡片
            prependCaseCard(data);

            // 2. 添加到时间线
            appendTimelineEvent(data);

            // 3. 更新统计
            updateStatsFromEvent(data);

            // 4. 更新最新事件ID
            document.getElementById('latestEventId').textContent = data.scenario_id;
        }

        function prependCaseCard(data) {
            const grid = document.getElementById('casesGrid');
            const empty = document.getElementById('emptyTip');
            if (empty) empty.remove();

            const card = document.createElement('div');
            card.className = `case-card ${data.risk_level.toLowerCase()} new-flash`;
            card.dataset.eventId = data.scenario_id;

            const violationsHtml = (data.violations || [])
                .map(v => `<span title="${escapeHtml(v.message || '')}">${escapeHtml(v.code || '')}</span>`)
                .join('');

            const kgPath = data.kg_path || `/output/kg_event_${data.scenario_id}.html`;

            card.innerHTML = `
                <div class="case-header">
                    <div class="case-scenario">${escapeHtml(data.scenario_name)}</div>
                    <span class="risk-badge ${data.risk_level}">${data.risk_level}</span>
                </div>
                <div class="case-info">
                    <span>🆔 #${data.scenario_id}</span>
                    <span>🕐 ${formatTime(data.timestamp)}</span>
                    <span>🚀 ${(data.ego_speed || 0).toFixed(1)} m/s</span>
                    <span>🚗 ${data.vehicle_count || 0} 辆</span>
                    <span>📊 ${(data.risk_index || 0).toFixed(2)}</span>
                </div>
                <div class="case-violations">${violationsHtml || '<span>无违规</span>'}</div>
                <a class="kg-link" href="${kgPath}" target="_blank">
                    📊 查看该事件图谱
                </a>
            `;

            grid.prepend(card);

            // 限制最大数量
            while (grid.children.length > MAX_CARDS) {
                grid.removeChild(grid.lastChild);
            }
        }

        function appendTimelineEvent(data) {
            const timeline = document.getElementById('timelineEvents');
            const empty = timeline.querySelector('.empty-tip');
            if (empty) empty.remove();

            const el = document.createElement('div');
            el.className = 'timeline-event';
            el.innerHTML = `
                <span><span class="id">#${data.scenario_id}</span> ${escapeHtml(data.scenario_name)} (${data.risk_level})</span>
                <span class="ts">${formatTime(data.timestamp)}</span>
            `;
            timeline.prepend(el);

            while (timeline.children.length > MAX_TIMELINE) {
                timeline.removeChild(timeline.lastChild);
            }
        }

        function updateStatsFromEvent(data) {
            const stats = {
                total: 0, critical: 0, high: 0, medium: 0, low: 0
            };
            document.querySelectorAll('.case-card').forEach(card => {
                stats.total++;
                if (card.classList.contains('critical')) stats.critical++;
                else if (card.classList.contains('high')) stats.high++;
                else if (card.classList.contains('medium')) stats.medium++;
                else if (card.classList.contains('low')) stats.low++;
            });
            renderStats(stats);
        }

        // ===== REST 兜底 =====
        async function updateStats() {
            try {
                const resp = await fetch(`${API_BASE}/detect/history?limit=1`);
                if (!resp.ok) return;
                const data = await resp.json();
                renderStats(data.stats || { total: 0, critical: 0, high: 0, medium: 0, low: 0 });
            } catch (e) {
                console.warn('updateStats 失败:', e);
            }
        }

        async function updateCases() {
            try {
                const resp = await fetch(`${API_BASE}/detect/history?limit=${MAX_CARDS}`);
                if (!resp.ok) return;
                const data = await resp.json();
                const history = data.history || [];
                if (history.length === 0) return;

                const grid = document.getElementById('casesGrid');
                const empty = document.getElementById('emptyTip');
                if (empty) empty.remove();
                grid.innerHTML = '';

                [...history].reverse().forEach(item => {
                    if (!seenEventIds.has(item.scenario_id)) seenEventIds.add(item.scenario_id);
                    prependCaseCard(item);
                    const card = grid.firstChild;
                    if (card) card.classList.remove('new-flash');
                });

                const timeline = document.getElementById('timelineEvents');
                const emptyT = timeline.querySelector('.empty-tip');
                if (emptyT) emptyT.remove();
                [...history].reverse().forEach(item => appendTimelineEvent(item));
            } catch (e) {
                console.warn('updateCases 失败:', e);
            }
        }

        async function updateCARLAStatus() {
            try {
                const resp = await fetch(`${API_BASE}/health`);
                if (!resp.ok) return;
                const data = await resp.json();
                const dot = document.getElementById('carlaDot');
                const text = document.getElementById('carlaText');
                if (data.carla_connected) {
                    dot.className = 'status-dot online';
                    text.textContent = '在线';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = '离线';
                }
            } catch (e) {
                document.getElementById('carlaText').textContent = '错误';
            }
        }

        function renderStats(stats) {
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.total || 0}</div>
                    <div class="stat-label">总事件</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value critical">${stats.critical || 0}</div>
                    <div class="stat-label">危急</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value high">${stats.high || 0}</div>
                    <div class="stat-label">高危</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value medium">${stats.medium || 0}</div>
                    <div class="stat-label">中危</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value low">${stats.low || 0}</div>
                    <div class="stat-label">低危</div>
                </div>
            `;
        }

        // ===== 操作 =====
        let detectionActive = false;

        async function startDetection(duration) {
            try {
                const resp = await fetch(`${API_BASE}/detect/run`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        duration, interval: 1.0, inject_anomalies: true
                    })
                });
                if (!resp.ok) {
                    alert('启动检测失败: ' + await resp.text());
                    return;
                }
                const result = await resp.json();
                if (result.success) {
                    seenEventIds.clear();
                    document.getElementById('latestEventId').textContent = '--';
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            }
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 启动持续检测任务
        async function startManualDetection() {
            const btn = document.querySelector('.btn-secondary');
            if (detectionActive) {
                showToast('检测已在运行中', 'warning');
                return;
            }
            try {
                btn.disabled = true;
                btn.textContent = '⏳ 启动中...';
                btn.classList.add('btn-active');

                // 调用后端启动持续检测
                const resp = await fetch(`${API_BASE}/detect/start`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const result = await resp.json();
                if (result.success) {
                    detectionActive = true;
                    btn.textContent = '✓ 检测运行中';
                    btn.style.background = '#52c41a';
                    // 清空旧数据
                    seenEventIds.clear();
                    document.getElementById('latestEventId').textContent = '--';
                    showToast('✅ ' + (result.message || '检测已启动'), 'success');
                } else {
                    showToast('❌ 启动失败: ' + (result.message || '未知错误'), 'error');
                    btn.disabled = false;
                    btn.textContent = '▶ 启动实时检测';
                    btn.classList.remove('btn-active');
                }
            } catch (e) {
                showToast('❌ 网络错误: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = '▶ 启动实时检测';
                btn.classList.remove('btn-active');
            }
        }

        async function stopManualDetection() {
            try {
                const resp = await fetch(`${API_BASE}/detect/stop`, {
                    method: 'POST'
                });
                const result = await resp.json();
                if (result.success) {
                    detectionActive = false;
                    const btn = document.querySelector('.btn-secondary');
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = '▶ 启动实时检测';
                        btn.style.background = '';
                        btn.classList.remove('btn-active');
                    }
                    showToast('⏹ ' + (result.message || '检测已停止'), 'info');
                } else {
                    showToast('❌ 停止失败: ' + (result.message || '未知错误'), 'error');
                }
            } catch (e) {
                showToast('❌ 网络错误: ' + e.message, 'error');
            }
        }

        function openGlobalKG() {
            window.open(`${HTTP_BASE}/output/knowledge_graph.html`, '_blank');
        }

        function clearData() {
            if (!confirm('确认清空显示？')) return;
            seenEventIds.clear();
            document.getElementById('casesGrid').innerHTML =
                '<div class="empty-tip" id="emptyTip">点击"开始检测"按钮启动实时检测</div>';
            document.getElementById('timelineEvents').innerHTML =
                '<div class="empty-tip">暂无检测事件</div>';
            document.getElementById('latestEventId').textContent = '--';
        }

        // ===== 工具 =====
        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(ts) {
            try {
                return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
            } catch {
                return ts;
            }
        }
    </script>
</body>
</html>
